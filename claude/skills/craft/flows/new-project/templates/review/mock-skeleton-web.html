<!-- 雛形(Web ページ型): 追加フォーム・検索・一覧・削除の確認ダイアログ・空状態・テーマ切替を、実際に操作できる。
     {{PROJECT_NAME}} と「サンプル」「項目 A/B/ラベル」の文言、色のトークン(:root)、検証規則(valid の行)を、その案件の
     design-system.md・design.md・stories.md の内容に置き換える。画面が複数ある案件は、主要な1〜2画面だけを作る。
     デスクトップアプリのウィンドウ型は mock-skeleton.html を使う。 -->
<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{PROJECT_NAME}} 画面モック</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root { --bg:#F7F2E8; --surface:#FFFFFF; --text:#26221C; --text-sub:#6B6256; --line:#DDD3C0; --accent:#A9481A; --on-accent:#FFFFFF; --tag:#EBE2CE;
    --success:#2E7D4F; --warning:#8A5A12; --error:#B3261E; --info:#5C5446;
    --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif; --font-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif; --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1B1814; --surface:#25211C; --text:#EDE6D9; --text-sub:#B3A998; --line:#3A342B; --accent:#E08A4F; --on-accent:#1B1814; --tag:#332D24;
    --success:#6FCF97; --warning:#E5B65C; --error:#F2837A; --info:#C9BFAE; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg:#1B1814; --surface:#25211C; --text:#EDE6D9; --text-sub:#B3A998; --line:#3A342B; --accent:#E08A4F; --on-accent:#1B1814; --tag:#332D24;
    --success:#6FCF97; --warning:#E5B65C; --error:#F2837A; --info:#C9BFAE; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.7 var(--font-body); padding:0 max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px)); }
  .back { margin:0 -16px; padding:8px 16px; font:12px/1.5 system-ui,sans-serif; }
  .back a { color:inherit; opacity:.7; }
  .back[hidden] { display:none; }
  .wrap { max-width:720px; margin:0 auto; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:16px 0 8px; }
  h1 { font:700 28px/1.3 var(--font-display); margin:0; }
  h2 { font:700 18px/1.4 var(--font-display); margin:28px 0 10px; }
  .note { color:var(--text-sub); font-size:13px; margin:2px 0 0; }
  .toggle { font:500 12px var(--font-body); color:var(--text); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; flex:none; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }


  /* Layout: Web ページを実寸で組んだモック。追加・検索・削除が動く(データはメモリ上のサンプルで、再読み込みで戻る) */
  form { display:grid; grid-template-columns:1fr 1fr; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px; box-shadow:0 1px 2px rgba(60,40,10,.08); }
  .f { display:flex; flex-direction:column; gap:2px; min-width:0; } .f.full { grid-column:1/-1; }
  label { font-size:12px; font-weight:700; color:var(--text-sub); }
  input[type=text] { font:15px var(--font-body); color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:6px 10px; width:100%; }
  input.bad { border-color:var(--error); } .err { color:var(--error); font-size:12px; min-height:18px; }
  .btn { font:500 14px var(--font-body); border-radius:8px; padding:6px 16px; border:1px solid var(--line); background:var(--surface); color:var(--text); cursor:pointer; }
  .btn.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); } .btn.danger { color:var(--error); border-color:var(--error); background:transparent; padding:2px 12px; font-size:13px; }
  .search { margin:20px 0 8px; } .search input { border:2px solid var(--accent); background:var(--surface); }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .bm { display:grid; grid-template-columns:4px 1fr auto; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 14px; box-shadow:0 1px 2px rgba(60,40,10,.08); }
  .bm i { align-self:stretch; background:var(--accent); border-radius:2px; } .bm .t { overflow-wrap:anywhere; }
  .bm small { display:block; color:var(--text-sub); font:13px var(--font-mono); overflow-wrap:anywhere; }
  .bm .m { font:500 11px var(--font-mono); color:var(--text-sub); } .tag { background:var(--tag); border-radius:999px; padding:0 10px; font-size:11px; font-weight:500; margin-right:4px; }
  .empty { text-align:center; color:var(--text-sub); padding:36px 12px; border:1px dashed var(--line); border-radius:8px; }
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); display:grid; place-items:center; padding:16px; } .scrim[hidden] { display:none; }
  .dlg { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 20px; max-width:360px; box-shadow:0 12px 28px rgba(60,40,10,.22); }
  .dlg p { margin:0 0 14px; } .acts { display:flex; justify-content:flex-end; gap:8px; }
  @media (max-width:640px) { form { grid-template-columns:1fr; } .bm { grid-template-columns:4px 1fr; } .bm .btn { grid-column:2; justify-self:start; } }
</style></head>
<body>
<p class="back" id="back-nav"><a href="../index.html">&larr; 一覧へ</a></p>
<div class="wrap">
<div class="bar"><div><h1>{{PROJECT_NAME}}</h1><p class="note">実寸のモックです。表示している内容はサンプルで、実際のデータではありません(再読み込みで元に戻ります)。</p></div><button class="toggle" id="theme-toggle" type="button">ダーク / ライト</button></div>
<form id="add" novalidate>
  <div class="f full"><label for="url">項目 A(必須)</label><input id="url" type="text" placeholder="例: sample-1"><span class="err" id="url-err" role="alert"></span></div>
  <div class="f"><label for="ttl">項目 B(任意)</label><input id="ttl" type="text"><span class="err" id="ttl-err" role="alert"></span></div>
  <div class="f"><label for="tag">ラベル(任意、カンマ区切り)</label><input id="tag" type="text"></div>
  <div class="f full"><button class="btn primary" type="submit" style="align-self:flex-start">追加</button></div>
</form>
<div class="search"><label for="q" class="note">検索(項目 A・B・ラベル)</label><input id="q" type="text" autocomplete="off"></div>
<ul id="list"></ul>
<div class="scrim" id="scrim" hidden><div class="dlg" role="alertdialog" aria-labelledby="dlg-msg"><p id="dlg-msg"></p><div class="acts"><button class="btn" id="cancel" type="button">キャンセル</button><button class="btn primary" id="ok" type="button">削除する</button></div></div></div>
</div>
<script>
(function(){
  var items=[
    {t:"サンプル項目 1",u:"sample-1",g:["ラベル X","ラベル Y"],at:"2026-01-03 09:30"},
    {t:"サンプル項目 2",u:"sample-2",g:["ラベル X"],at:"2026-01-02 18:05"},
    {t:"sample-3",u:"sample-3",g:[],at:"2026-01-01 07:42"}];
  var $=function(i){return document.getElementById(i)},list=$("list"),pending=null;
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  /** 検索語で絞り込んで一覧を描き直す。0件のときは状況に応じた空状態を出す */
  function render(){
    var w=$("q").value.trim().toLowerCase();list.textContent="";
    var shown=items.filter(function(b){return !w||(b.t+" "+b.u+" "+b.g.join(" ")).toLowerCase().indexOf(w)>=0});
    if(!shown.length){var li=el("li","empty",items.length?"一致する項目がありません":"まだ登録がありません。上のフォームから追加してください");list.appendChild(li);return}
    shown.forEach(function(b){
      var li=el("li","bm");li.appendChild(el("i"));
      var d=el("div");d.appendChild(el("div","t",b.t));d.appendChild(el("small",null,b.u));
      var m=el("div","m",b.at+"　");b.g.forEach(function(x){m.appendChild(el("span","tag",x))});d.appendChild(m);li.appendChild(d);
      var del=el("button","btn danger","削除");del.type="button";del.addEventListener("click",function(){pending=b;$("dlg-msg").textContent="「"+b.t+"」を削除します。元に戻せません。";$("scrim").hidden=false;$("cancel").focus()});
      li.appendChild(del);list.appendChild(li)});
  }
  function err(id,inp,msg){$(id).textContent=msg;$(inp).classList.toggle("bad",!!msg)}
  $("add").addEventListener("submit",function(ev){
    ev.preventDefault();var u=$("url").value.trim(),t=$("ttl").value.trim(),ok=true;err("url-err","url","");err("ttl-err","ttl","");
    var valid=u.length>0; /* 実際の検証規則に置き換える */
    if(!valid){err("url-err","url","項目 A を入力してください");ok=false}
    else if(items.some(function(b){return b.u===u})){err("url-err","url","登録済みです");ok=false}
    if(t.length>200){err("ttl-err","ttl","項目 B は 200 文字までです");ok=false}
    if(!ok)return;
    items.unshift({t:t||u,u:u,g:$("tag").value.split(",").map(function(x){return x.trim()}).filter(Boolean),at:"2026-01-04 10:00"});
    $("add").reset();render();
  });
  $("q").addEventListener("input",render);
  function close(){$("scrim").hidden=true;pending=null}
  $("cancel").addEventListener("click",close);
  $("ok").addEventListener("click",function(){items=items.filter(function(b){return b!==pending});close();render()});
  $("scrim").addEventListener("keydown",function(ev){if(ev.key==="Escape")close()});
  render();
})();
</script><script>(function(){var r=document.documentElement,b=document.getElementById("theme-toggle");if(!b)return;b.addEventListener("click",function(){var d=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);r.setAttribute("data-theme",d?"light":"dark");});})();</script>
<script>if(window.top!==window){var b=document.getElementById("back-nav");if(b)b.hidden=true;}</script>
</body></html>
